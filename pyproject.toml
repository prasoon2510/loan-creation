
[project]
name = "loan-creation-api"
version = "0.1.0"
description = "Loan Creation API using FastAPI and Python"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Srikanta Vai Sravan Sharma", email = "adirajusrikantasharma@gmail.com" }
]

dependencies = [
    "fastapi",
    "uvicorn",
    "requests",
    "python-dotenv"
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
